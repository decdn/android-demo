[package]
name = "decdn-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/decdn/android-demo"
publish = false

# The deCDN client SDK as a shared library the Android app loads over JNI.
[lib]
crate-type = ["cdylib"]

[dependencies]
decdn-client = "0.0.4"
decdn-incentive = { version = "0.0.4", features = ["redb"] }
alloy = { version = "2", features = ["signers", "signer-keystore"] }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = "0.7"
# Same majors the decdn graph resolves on Android: rustls-platform-verifier
# and n0-dns-resolver both read the app context through these.
jni = "0.22"
ndk-context = "0.1"
rustls-platform-verifier = "0.7.1"

[profile.release]
opt-level = 3
strip = "debuginfo"

# Standalone: not a member of the decdn workspace.
[workspace]
